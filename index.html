<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YDML Web Assistant</title><link rel="stylesheet" href="/styles.css">
</head>
<body><main class="shell"><section class="card">
<header><div class="logo">YD</div><div><h1>YDML Web Assistant</h1><p>ผู้ช่วยสำหรับ “มื้อนี้...มีความหมาย”</p></div></header>
<section id="chat" class="chat"><div class="bubble bot">สวัสดีค่ะ เลือกเมนูด้านล่าง หรือพิมพ์คำถามเกี่ยวกับโครงการได้เลย</div></section>
<section class="quick"><button data-a="order">🍚 สั่งอาหารถวายพระ</button><button data-a="track">🔎 ติดตามคำสั่งซื้อ</button><button data-a="contact">💬 ติดต่อทีมงาน</button><button data-a="help">✨ สอบถามทั่วไป</button></section>
<form id="form"><input id="msg" maxlength="700" placeholder="พิมพ์คำถาม..."><button>ส่ง</button></form>
<footer>ไม่ใช้ Facebook/Meta เป็นตัวกลางในการสนทนา และไม่ขอรหัสผ่านหรือโทเคนจากผู้ใช้</footer>
</section></main><script src="/app.js" defer></script></body></html>
